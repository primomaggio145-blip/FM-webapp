name: Instagram Sync

# Chiama periodicamente la Edge Function "instagram-sync" su Supabase, che
# scarica gli ultimi post dall'account Instagram collegato e li aggiunge
# alla sezione SOCIAL del sito (se non già presenti).
#
# Può anche essere avviato a mano dal tab "Actions" di GitHub con "Run workflow".
#
# Secrets usati (riutilizza quelli già presenti nel repo per il backup DB):
#   SUPABASE_URL              già esistente — usato per costruire l'URL della function
#   SUPABASE_SERVICE_ROLE_KEY già esistente — usato come header di autorizzazione
#                              verso la Edge Function (necessario perché Supabase
#                              richiede sempre una chiave valida per superare il
#                              suo gateway, anche se poi l'autorizzazione "vera" la
#                              fa la function stessa controllando FM_SYNC_SECRET)
#   FM_SYNC_SECRET             NUOVO — va creato apposta (Settings → Secrets and
#                              variables → Actions → New repository secret),
#                              deve combaciare con il secret omonimo impostato
#                              sulla Edge Function su Supabase.

on:
  schedule:
    # ogni 2 ore
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Richiama la function instagram-sync
        run: |
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/instagram-sync" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "X-Sync-Secret: ${{ secrets.FM_SYNC_SECRET }}" \
            -H "Content-Type: application/json")
          echo "--- Risposta (HTTP $HTTP_CODE) ---"
          cat response.json
          echo
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "❌ Sync fallita"
            exit 1
          fi
          echo "✅ Sync completata"
