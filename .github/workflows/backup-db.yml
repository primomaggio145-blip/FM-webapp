name: Backup DB (pg_dump)

# Si avvia in due modi:
# 1) Manualmente, da un pulsante nella webapp (via repository_dispatch,
#    innescato dalla Edge Function admin-trigger-backup)
# 2) Automaticamente ogni notte alle 03:00 UTC (04:00/05:00 ora italiana)
on:
  repository_dispatch:
    types: [db-backup]
  workflow_dispatch: {}      # permette anche l'avvio manuale da GitHub
  schedule:
    - cron: '0 3 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Calcola nome file
        id: nome
        run: echo "filename=futuro-musica-$(date -u +%Y%m%d-%H%M%S).dump" >> "$GITHUB_OUTPUT"

      # Usa l'immagine Docker ufficiale postgres per avere un pg_dump
      # compatibile con la versione del server Supabase.
      # ⚠️ Verifica su Supabase (Project Settings → Database) quale major
      #    version usa il progetto e allinea il tag "postgres:16" sotto.
      #
      # NOTA IMPORTANTE: la connessione diretta (db.<ref>.supabase.co) è
      # solo IPv6 — i runner di GitHub Actions non hanno IPv6 in uscita,
      # quindi qui usiamo il CONNECTION POOLER di Supabase (Supavisor),
      # raggiungibile anche via IPv4. Serve host/utente diversi (vedi
      # secrets SUPABASE_DB_HOST e SUPABASE_DB_USER, spiegati sotto).
      - name: Esegui pg_dump (via pooler, IPv4)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          docker run --rm -e PGPASSWORD \
            postgres:17.6 \
            pg_dump -h "${{ secrets.SUPABASE_DB_HOST }}" -p 5432 \
              -U "${{ secrets.SUPABASE_DB_USER }}" -d postgres -F c \
            > "${{ steps.nome.outputs.filename }}"

      - name: Verifica dimensione file
        run: ls -lh "${{ steps.nome.outputs.filename }}"

      - name: Carica su Supabase Storage (bucket privato "backups")
        run: |
          curl -sf -X POST \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/backups/${{ steps.nome.outputs.filename }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"${{ steps.nome.outputs.filename }}"

      # Conserva anche come artifact di GitHub Actions per 90 giorni,
      # come rete di sicurezza indipendente da Supabase.
      - name: Conserva come artifact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nome.outputs.filename }}
          path: ${{ steps.nome.outputs.filename }}
          retention-days: 90
