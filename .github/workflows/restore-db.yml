name: Restore DB (pg_restore)

# Si avvia SOLO manualmente: dal pulsante "Ripristina" nella webapp
# (via repository_dispatch, innescato da admin-trigger-restore), oppure
# a mano da GitHub Actions con "Run workflow" specificando il filename.
on:
  repository_dispatch:
    types: [db-restore]
  workflow_dispatch:
    inputs:
      filename:
        description: 'Nome del file .dump da ripristinare (es. futuro-musica-20260803-030000.dump)'
        required: true
        type: string

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Determina il filename
        id: file
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "filename=${{ github.event.client_payload.filename }}" >> "$GITHUB_OUTPUT"
          else
            echo "filename=${{ inputs.filename }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Valida il nome del file (whitelist anti path-traversal)
        run: |
          FN="${{ steps.file.outputs.filename }}"
          if ! echo "$FN" | grep -qE '^futuro-musica-[0-9]{8}-[0-9]{6}\.dump$'; then
            echo "❌ Nome file non valido: $FN"
            exit 1
          fi

      - name: Scarica il dump da Supabase Storage
        run: |
          curl -sf -o "${{ steps.file.outputs.filename }}" \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/backups/${{ steps.file.outputs.filename }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

      - name: Verifica dimensione file scaricato
        run: ls -lh "${{ steps.file.outputs.filename }}"

      # ⚠️ --clean e --data-only sono INCOMPATIBILI in pg_restore (errore:
      # "options -c/--clean and -a/--data-only cannot be used together").
      # Per ottenere lo stesso risultato (svuota-e-reinserisci, senza
      # toccare lo schema) separiamo le due operazioni:
      #   1) TRUNCATE esplicito di tutte le tabelle dello schema public
      #      (CASCADE gestisce da solo l'ordine delle foreign key)
      #   2) pg_restore --data-only (nessun --clean) per reinserire i dati
      #
      # Questo significa che qualsiasi riga creata DOPO il backup, in una
      # tabella presente nel dump, viene persa. È un ripristino "totale",
      # non selettivo — per un ripristino mirato di poche tabelle vedi la
      # procedura manuale con --table=... discussa in chat.
      - name: Svuota le tabelle dello schema public (TRUNCATE CASCADE)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          docker run --rm -e PGPASSWORD \
            postgres:17 \
            psql -h "${{ secrets.SUPABASE_DB_HOST }}" -p 5432 \
              -U "${{ secrets.SUPABASE_DB_USER }}" -d postgres -v ON_ERROR_STOP=1 -c "
            DO \$\$
            DECLARE
              stmt text;
            BEGIN
              SELECT string_agg(format('%I.%I', schemaname, tablename), ', ')
                INTO stmt
                FROM pg_tables
                WHERE schemaname = 'public';
              IF stmt IS NOT NULL THEN
                EXECUTE 'TRUNCATE TABLE ' || stmt || ' CASCADE';
              END IF;
            END \$\$;
            "

      # ⚠️ --disable-triggers NON FUNZIONA su Supabase: richiede privilegi
      # superuser reali per disattivare i trigger di sistema che applicano
      # le foreign key (RI_ConstraintTrigger_*), e l'utente "postgres" su
      # Supabase NON è un vero superuser (riservato internamente).
      # Il flag fallisce silenziosamente e i vincoli FK restano attivi:
      # se pg_restore inserisce una tabella figlia prima del suo genitore,
      # l'inserimento viene rifiutato (violazione FK).
      #
      # Soluzione: invece di disattivare i controlli, FORZIAMO l'ordine di
      # ripristino genitore→figlio, riordinando la lista TOC del dump prima
      # di eseguire pg_restore. Così i vincoli non vengono mai violati.
      - name: Genera l'ordine di ripristino (genitori prima dei figli)
        run: |
          docker run --rm -v "$PWD:/backup" postgres:17 \
            pg_restore -l "/backup/${{ steps.file.outputs.filename }}" > toc.list

          ORDINE=(
            docenti corsi anni_scolastici utenti richieste_accesso sito_config
            sito_attivita corsi_complementari allegati profili biblioteca
            notifiche notifiche_config whatsapp_config messaggi iscrizioni_anno
            brani concerti push_subscriptions prenotazioni_sala gcal_events
            google_calendar_tokens
            corsi_docenti studenti spese concerti_prenotazioni
            lezioni repertorio_studenti quote brani_studenti
            concerti_partecipanti richieste_recupero whatsapp_log
          )

          : > toc_ordered.list
          : > toc_used.list

          for t in "${ORDINE[@]}"; do
            LINE=$(grep -E "TABLE DATA public ${t} " toc.list || true)
            if [ -n "$LINE" ]; then
              echo "$LINE" >> toc_ordered.list
              echo "$LINE" >> toc_used.list
            fi
          done

          # tutto il resto del TOC (header, SEQUENCE SET, ACL, eventuali tabelle
          # non previste nell'elenco sopra) va in coda, nell'ordine originale
          grep -v -F -x -f toc_used.list toc.list >> toc_ordered.list

          echo "--- Ordine di ripristino generato ---"
          grep "TABLE DATA" toc_ordered.list

      - name: Esegui pg_restore --data-only, in ordine genitore→figlio (via pooler, IPv4)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          docker run --rm -e PGPASSWORD \
            -v "$PWD:/backup" \
            postgres:17 \
            pg_restore --data-only -L /backup/toc_ordered.list \
              -h "${{ secrets.SUPABASE_DB_HOST }}" -p 5432 \
              -U "${{ secrets.SUPABASE_DB_USER }}" -d postgres \
              "/backup/${{ steps.file.outputs.filename }}"

      - name: Esito
        run: echo "✅ Ripristino completato da ${{ steps.file.outputs.filename }}"
